name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
  deploy:
    needs: ci
    # Skipped until #12 creates the production D1 and sets the repo variable, so main stays green meanwhile.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.D1_PRODUCTION_ID != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The production D1 database's ID (repo variable), the same one as in cloudflare.config.ts. Created by #12.
      D1_PRODUCTION_ID: ${{ vars.D1_PRODUCTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      # Before the new code: migrations must stay additive.
      # cf takes the D1 ID from cloudflare.config.ts, not the binding name.
      - run: npx cf d1 migrations apply "$D1_PRODUCTION_ID" --mode production
      - run: npm run deploy
